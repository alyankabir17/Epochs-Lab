    <meta name="description" content="Describe a machine learning goal in plain English. Specialist agents build the pipeline in a notebook you can read." />

    <script>
      (function () {
        try {
          var theme = localStorage.getItem('epochs_theme') || localStorage.getItem('epochslab-theme') || 'system';
          var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {}
      }());
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
